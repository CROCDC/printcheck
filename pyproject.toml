[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "printcheck"
version = "0.1.1"
description = "Printability validator for FDM 3D prints: GO / NO-GO with measured numbers, a layer-by-layer simulation, calibrated on a corpus of real failures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Camilo Romero" }]
keywords = ["3d-printing", "fdm", "bambu-lab", "gcode", "3mf", "stl", "printability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "trimesh>=4.4",
    "shapely>=2.0",
    "networkx>=3.0",
    "rtree>=1.2",
    "manifold3d>=2.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
printcheck = "printcheck.preflight:main"
printcheck-calibrate = "printcheck.calibrate:main"

[project.urls]
Repository = "https://github.com/CROCDC/printcheck"

# The repository root is the package: `import printcheck` maps onto it.
[tool.setuptools]
package-dir = { "printcheck" = "." }
packages = ["printcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: the repository root is the package and has an __init__.py,
# so the default mode would import it under the checkout folder's name.
addopts = "-p no:cacheprovider --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["printcheck"]
omit = ["*/tests/*", "*/examples/*", "*/corpus/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
